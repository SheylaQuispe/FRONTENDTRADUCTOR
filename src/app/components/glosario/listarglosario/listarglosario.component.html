<div class="container">
  <div style="text-align: center; margin: 6%">
    <h1>GLOSARIO</h1>
  </div>

  <div>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="c1">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let element">{{ element.idGlosario }}</td>
      </ng-container>

      <!-- Name Column -->
      <ng-container matColumnDef="c2">
        <th mat-header-cell *matHeaderCellDef>Palabra</th>
        <td mat-cell *matCellDef="let element">{{ element.palabra }}</td>
      </ng-container>
      <!-- Name Column -->
      <ng-container matColumnDef="c3">
        <th mat-header-cell *matHeaderCellDef>Descripcion</th>
        <td mat-cell *matCellDef="let element">{{ element.descripcion }}</td>
      </ng-container>

       <!-- Symbol Column -->
        <ng-container matColumnDef="c4">
          <th mat-header-cell *matHeaderCellDef>Actualizar</th>
          <td mat-cell *matCellDef="let element">
            <button matButton class="btn-wobble" [routerLink]="['ediciones',element.idGlosario]" >
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

            <!-- Symbol Column -->
            <ng-container matColumnDef="c5">
              <th mat-header-cell *matHeaderCellDef>Eliminar</th>
              <td mat-cell *matCellDef="let element">
                <button matButton 
                class="btn-wobble"
                  (click)="eliminar(element.idGlosario)"
                  >
                  <mat-icon>delete</mat-icon>
                </button>
              </td>
            </ng-container>

    
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
